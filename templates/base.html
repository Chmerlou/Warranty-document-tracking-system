{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body>
    <a class="skip-link" href="#main-content">К содержанию</a>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="{% url 'homepage:index' %}">
                <img
                    class="brand__logo"
                    src="{% static 'homepage/img/logo.svg' %}"
                    width="40"
                    height="40"
                    alt="Логотип гарантийного реестра"
                >
                <span>{{ site_name }}</span>
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        &copy; <span id="current-year"></span> Учебный проект на Django 5.2
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
