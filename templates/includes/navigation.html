<nav class="site-nav" aria-label="Основная навигация">
    <a
        class="site-nav__link{% if request.resolver_match.namespace == 'homepage' %} is-active{% endif %}"
        href="{% url 'homepage:index' %}"
        {% if request.resolver_match.namespace == 'homepage' %}aria-current="page"{% endif %}
    >Главная</a>
    <a
        class="site-nav__link{% if request.resolver_match.namespace == 'warranties' and request.resolver_match.url_name != 'statistics' %} is-active{% endif %}"
        href="{% url 'warranties:list' %}"
        {% if request.resolver_match.namespace == 'warranties' and request.resolver_match.url_name != 'statistics' %}aria-current="page"{% endif %}
    >Гарантии ({{ registry_documents_count }})</a>
    <a
        class="site-nav__link{% if request.resolver_match.namespace == 'clients' %} is-active{% endif %}"
        href="{% url 'clients:list' %}"
        {% if request.resolver_match.namespace == 'clients' %}aria-current="page"{% endif %}
    >Клиенты</a>
    <a
        class="site-nav__link{% if request.resolver_match.url_name == 'statistics' %} is-active{% endif %}"
        href="{% url 'warranties:statistics' %}"
        {% if request.resolver_match.url_name == 'statistics' %}aria-current="page"{% endif %}
    >Статистика</a>
</nav>
